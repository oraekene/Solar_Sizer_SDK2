app = "solar-sizer-gateway"
primary_region = "jnb"

[build]
  dockerfile = "scraper/host/Dockerfile"

[env]
  PORT = "3001"
  HOST = "127.0.0.1"

[mounts]
  source = "freellmapi_data"
  destination = "/app/server/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[processes]
  app = "node /app/start.mjs"

[deploy]
  strategy = "rolling"
