name: Scraper watchdog

# The watchdog checks that the daily sweep wrote a full run report. A sweep
# that was partial leaves a source unfinished, so it raises the alert as well.
# It runs at 06:00 West Africa time, which is 05:00 UTC. See
# docs/scraper-design.md section 8.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check the last sweep
        id: check
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The Worker may answer with an error, for example when the admin
          # password is wrong. The watchdog must raise the alert in that case
          # instead of stopping on a broken answer.
          HTTP=$(curl -sS -o runs.json -w '%{http_code}' -H "x-admin-key: ${ADMIN_PASSWORD}" "${WORKER_URL}/api/scraper/runs?kind=sweep&limit=5" || true)
          RUNS=$(cat runs.json 2>/dev/null || echo '{}')
          LAST=$(echo "${RUNS}" | jq -r '[(.runs // [])[] | select(.status == "ok")][0].finished_at // empty' 2>/dev/null || echo '')
          PARTIAL=$(echo "${RUNS}" | jq -r --arg ok "${LAST}" '[(.runs // [])[] | select(.status == "partial" and (.finished_at > $ok))][0].run_id // empty' 2>/dev/null || echo '')
          NOW=$(date -u +%s)
          if [ -z "${LAST}" ]; then
            AGE=999999999
          else
            AGE=$(( NOW - $(date -u -d "${LAST}" +%s) ))
          fi
          echo "last complete sweep: ${LAST:-never}, age ${AGE} seconds, route status ${HTTP}"
          if [ "${HTTP}" != "200" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "message=The Worker answered the run list with status ${HTTP}, so the last complete sweep cannot be confirmed. Check WORKER_URL and ADMIN_PASSWORD." >> "$GITHUB_OUTPUT"
          elif [ "${AGE}" -gt 93600 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "message=No complete sweep since ${LAST:-never}. The Solar Sizer hardware prices are no longer being refreshed." >> "$GITHUB_OUTPUT"
          elif [ -n "${PARTIAL}" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "message=The last sweep ${PARTIAL} was partial, so one source did not finish. Check the run report for the pause reason." >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Raise the alert
        if: steps.check.outputs.stale == 'true'
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: ${{ steps.check.outputs.message }}
        run: |
          set -euo pipefail
          ISSUE=$(gh issue list --label scraper-alert --state open --json number --jq '.[0].number // empty')
          if [ -n "${ISSUE}" ]; then
            gh issue comment "${ISSUE}" --body "${MESSAGE}"
          else
            gh issue create --title "Scraper sweep did not run" --body "${MESSAGE}" --label scraper-alert
          fi
          PAYLOAD=$(jq -n --arg message "${MESSAGE}" '{message: $message}')
          curl -sS -X POST \
            -H "x-admin-key: ${ADMIN_PASSWORD}" \
            -H "content-type: application/json" \
            -d "${PAYLOAD}" \
            "${WORKER_URL}/api/scraper/alert" || echo "the WhatsApp alert could not be sent"
          exit 1
