name: Scraper discovery

# The weekly discovery crawl walks the watchlist paths and adds the new
# listings to the pool. It runs on Sunday at 03:00 West Africa time, which
# is 02:00 UTC. See docs/scraper-design.md section 3.

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scraper-discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The runner uses only the Node standard library, so nothing is
      # installed.
      - name: Run the discovery crawl
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          FX_RATE_URL: ${{ secrets.FX_RATE_URL }}
        run: npm run scraper:discovery
